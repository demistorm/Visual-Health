// Common module build configuration for VR Swing Sprint
// This module contains all the shared logic that works across Fabric, Forge, and NeoForge
// All VR swing sprint mechanics go here - only platform-specific code in loader modules

// Configure Architectury for this common module
// This tells Architectury which loaders we're building for
architectury {
    common(rootProject.enabled_platforms.split(","))
}

// stub classes for optional mod targets (Mixin AP needs them at compile time)
sourceSets.main.java.srcDirs += 'src/stubs/java'

// Loom configuration for the common module
loom {
    // Access widener for NativeImage pixel manipulation methods
    def aw = file("src/main/resources/visualhealth.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    // Custom refmap name for mixin remapping
    mixin {
        defaultRefmapName.set("visualhealth.refmap.json")
    }
}

repositories {
    // Modrinth Maven for Vivecraft dependency
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    // Fabric loader dependency - needed for @Environment annotations only
    // This allows us to separate client-side code from server-side code across all loaders
    // IMPORTANT: Do NOT use other Fabric classes in common code - only annotations!
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // EMF compat
    // modCompileOnly "maven.modrinth:4I1XuqiY:3.0.11-fabric-1.20.1"

    // ETF compat
    // modCompileOnly "maven.modrinth:BVzZfTc1:7.0.8-fabric-1.20.1"

}

// Exclude stub classes from the output JAR - they're compile-only
jar {
    exclude 'net/irisshaders/**'
    exclude 'net/raphimc/**'
    exclude 'net/diebuddies/**'
}

// Publishing configuration for the common module
// This allows other mods to depend on our common API if needed
publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // Configure repositories for publishing (if needed in future)
    repositories {
        // Add repositories to publish to here
    }
}

// Java configuration for the common module
java {
    // Ensure consistent Java version across all platforms
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Additional Java compile options
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
