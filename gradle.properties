# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Multi-Loader Configuration
# Forge disabled - not actively maintained for modern versions
enabled_platforms=fabric,neoforge

# Minecraft version target
minecraft_version=26.2
minecraft_version_publish_range=[26.2,26.3)

# Fabric Properties
# Check these on https://fabricmc.net/develop
fabric_loader_version=0.19.3
fabric_api_version=0.153.0+26.2

# NeoForge version for target Minecraft version
# Check these on https://neoforged.net/
neoforge_version=26.2.0.7-beta

# Architectury Properties (for mutliloader support)
architectury_plugin_version=3.5-SNAPSHOT
loom_version=1.14-SNAPSHOT

# Mod Properties
mod_version=2.0.1
maven_group=win.demistorm
archives_base_name=visualhealth

# Mod Menu for Fabric only (still nice to have for Fabric users)
modmenu_version=18.0.0-alpha.8
