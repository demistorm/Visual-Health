# Access Transformer for Visual Health mod (NeoForge)
# Uses Mojmap field names (MC 26.1 is unobfuscated)

# Make EntityRenderDispatcher.renderers accessible
# Required to register damage overlay layers to all entity renderers
public net.minecraft.client.renderer.entity.EntityRenderDispatcher renderers

# Make EntityRenderDispatcher.playerRenderers accessible
# Required to register damage overlay layers to player skin renderers
public net.minecraft.client.renderer.entity.EntityRenderDispatcher playerRenderers

# Make LivingEntityRenderer.layers accessible
# Required to add damage overlay layer to entity renderers
public net.minecraft.client.renderer.entity.LivingEntityRenderer layers

# Make sprite field accessible in SpriteCoordinateExpander
# Required to extract texture being rendered (for applying damage textures)
public net.minecraft.client.renderer.SpriteCoordinateExpander sprite
